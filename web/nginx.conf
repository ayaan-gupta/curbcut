server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 3m;
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml application/wasm;

    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json webmanifest;
        application/wasm wasm;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        application/octet-stream onnx;
    }

    location /api/ {
        proxy_pass http://api:8109;
        proxy_set_header Host $host;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
}
