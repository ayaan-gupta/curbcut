name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: curbcut
          POSTGRES_PASSWORD: curbcut
          POSTGRES_DB: curbcut
        ports:
          - 5509:5432
        options: >-
          --health-cmd "pg_isready -U curbcut -d curbcut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CURBCUT_TEST_DATABASE_URL: postgresql://curbcut:curbcut@localhost:5509/curbcut_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
